backend:
  name: github
  repo: haarajoki-ry/haarajoki-ry.github.io  # Update this to your actual repo
  branch: main

media_folder: static/images/uploads
public_folder: /images/uploads

locale: fi

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: ajankohtaista
    label: Ajankohtaista
    folder: content/ajankohtaista
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: Otsikko, name: title, widget: string }
      - { label: Päivämäärä, name: date, widget: datetime }
      - { label: Tiivistelmä, name: summary, widget: text, required: false }
      - { label: Sisältö, name: body, widget: markdown }

  - name: sivut
    label: Sivut
    files:
      - label: Etusivu
        name: etusivu
        file: content/_index.md
        fields:
          - { label: Otsikko, name: title, widget: string }
          - { label: Alaotsikko, name: subtitle, widget: string, required: false }
          - { label: Sisältö, name: body, widget: markdown }

      - label: Yhteystiedot
        name: yhteystiedot
        file: content/yhteystiedot.md
        fields:
          - { label: Otsikko, name: title, widget: string }
          - { label: Sisältö, name: body, widget: markdown }

      - label: Yhdistys
        name: yhdistys
        file: content/yhdistys.md
        fields:
          - { label: Otsikko, name: title, widget: string }
          - { label: Sisältö, name: body, widget: markdown }

      - label: Säännöt
        name: saannot
        file: content/saannot.md
        fields:
          - { label: Otsikko, name: title, widget: string }
          - { label: Sisältö, name: body, widget: markdown }
