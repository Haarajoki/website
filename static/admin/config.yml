backend:
  name: github
  repo: haarajoki/website.github.io  # Update this to your actual repo
  branch: main

media_folder: static/images/uploads
public_folder: /images/uploads

locale: fi

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: ajankohtaista
    label: Ajankohtaista
    folder: content/ajankohtaista
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: Otsikko, name: title, widget: string }
      - { label: Päivämäärä, name: date, widget: datetime }
      - { label: Tiivistelmä, name: summary, widget: text, required: false }
      - { label: Sisältö, name: body, widget: markdown }

  - name: sivut
    label: Sivut
    files:
      - label: Etusivu
        name: etusivu
        file: content/_index.md
        fields:
          - { label: Otsikko, name: title, widget: string }
          - { label: Alaotsikko, name: subtitle, widget: string, required: false }
          - { label: Sisältö, name: body, widget: markdown }

      - label: Yhdistys
        name: yhdistys
        file: content/yhdistys.md
        fields:
          - { label: Otsikko, name: title, widget: string }
          - { label: Sisältö, name: body, widget: markdown }

      - label: Werso – Kylätalo
        name: werso
        file: content/werso.md
        fields:
          - { label: Otsikko, name: title, widget: string }
          - { label: Sisältö, name: body, widget: markdown }

      - label: Yhteystiedot
        name: yhteystiedot
        file: content/yhteystiedot.md
        fields:
          - { label: Otsikko, name: title, widget: string }
          - { label: Sisältö, name: body, widget: markdown }

      - label: Lemmenlaakso ja mylly
        name: lemmenlaakso
        file: content/lemmenlaakso.md
        fields:
          - { label: Otsikko, name: title, widget: string }
          - { label: Sisältö, name: body, widget: markdown }

      - label: Julkiset palvelut
        name: palvelut
        file: content/palvelut.md
        fields:
          - { label: Otsikko, name: title, widget: string }
          - { label: Sisältö, name: body, widget: markdown }

      - label: Haarajoen yrityksiä
        name: yritykset
        file: content/yritykset.md
        fields:
          - { label: Otsikko, name: title, widget: string }
          - { label: Sisältö, name: body, widget: markdown }

      - label: Muut yhdistykset
        name: muut-yhdistykset
        file: content/muut-yhdistykset.md
        fields:
          - { label: Otsikko, name: title, widget: string }
          - { label: Sisältö, name: body, widget: markdown }
