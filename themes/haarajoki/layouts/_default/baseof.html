<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta name="theme-color" content="#1b3a27">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | absURL }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/style.css" | absURL }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="{{ "/" | absURL }}" class="site-logo">
        <svg class="logo-mark" viewBox="0 0 26 34" fill="none" aria-hidden="true">
          <path d="M13 33 L13 17 C13 11 5 5 2 1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          <path d="M13 17 C13 11 21 5 24 1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="logo-text">{{ site.Title }}</span>
      </a>
      <nav class="site-nav" id="site-nav">
        {{ range site.Menus.main }}
          <a href="{{ .URL | absURL }}" class="nav-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}">{{ .Name }}</a>
        {{ end }}
      </nav>
      <button class="nav-toggle" id="nav-toggle" aria-label="Avaa valikko">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="footer-body">
      <div class="footer-brand">
        <svg class="logo-mark" viewBox="0 0 26 34" fill="none" aria-hidden="true">
          <path d="M13 33 L13 17 C13 11 5 5 2 1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          <path d="M13 17 C13 11 21 5 24 1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        </svg>
        <p class="footer-title">{{ site.Title }}</p>
        <p class="footer-address">{{ site.Params.address }}</p>
      </div>
      <div class="footer-nav">
        <p class="footer-nav-title">Sivut</p>
        {{ range site.Menus.main }}
          <a href="{{ .URL | absURL }}">{{ .Name }}</a>
        {{ end }}
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; {{ now.Year }} {{ site.Title }}</p>
    </div>
  </footer>

  <script>
    // Mobile nav
    const toggle = document.getElementById('nav-toggle');
    const nav = document.getElementById('site-nav');
    toggle.addEventListener('click', function() {
      toggle.classList.toggle('active');
      nav.classList.toggle('open');
    });

    // Close mobile nav when clicking a link
    nav.querySelectorAll('.nav-link').forEach(function(link) {
      link.addEventListener('click', function() {
        toggle.classList.remove('active');
        nav.classList.remove('open');
      });
    });

    // Scroll reveal
    if ('IntersectionObserver' in window) {
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
      document.querySelectorAll('.reveal').forEach(function(el) {
        observer.observe(el);
      });
    }
  </script>
</body>
</html>
