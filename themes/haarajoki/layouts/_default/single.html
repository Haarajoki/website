{{ define "main" }}
<article class="container--narrow">
  {{ if eq .Section "ajankohtaista" }}
  <nav class="breadcrumb" style="padding-top: 2rem;">
    <a href="{{ "/" | absURL }}">Etusivu</a>
    <span class="sep">/</span>
    <a href="{{ "ajankohtaista/" | absURL }}">Ajankohtaista</a>
  </nav>
  {{ end }}

  <div class="page-header">
    <h1>{{ .Title }}</h1>
    {{ if eq .Section "ajankohtaista" }}
    <div class="page-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2.1.2006" }}</time>
    </div>
    {{ end }}
  </div>

  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
