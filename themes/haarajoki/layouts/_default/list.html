{{ define "main" }}
<div class="container">
  <div class="list-header">
    <h1>{{ .Title }}</h1>
  </div>

  {{ .Content }}

  <div class="news-grid" style="padding-bottom: 4rem;">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" class="news-card reveal">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2.1.2006" }}</time>
      <h3>{{ .Title }}</h3>
      {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
