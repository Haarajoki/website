{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}

<div class="news-list">
  {{ range .Pages }}
  <article class="news-item">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2.1.2006" }}</time>
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
  </article>
  {{ end }}
</div>
{{ end }}
